# 릴리스 자산(wheel + sdist) 첨부.
#
# 왜 태그 push 가 아니라 **release published** 인가: 실제 절차는
# `git push origin vX.Y.Z` → `gh release create` 순서라, 태그에 걸면
# 릴리스가 아직 없는 상태에서 업로드가 터진다. 릴리스 발행에 걸면 순서
# 문제가 사라지고 이벤트가 태그 이름까지 실어 준다.
#
# 손으로 `python -m build && gh release upload` 하던 절차였고, v9.16.0~
# v9.19.0 네 번 연속 빠뜨려 릴리스가 자산 없이 나갔다(사용자 제보).
name: Release assets

on:
  release:
    types: [published]
  # 지난 릴리스 보정용 — 태그를 직접 넣어 다시 돌린다.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach (e.g. v9.19.0)"
        required: true

permissions:
  contents: write  # gh release upload

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: t
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      # 그 태그의 트리에서 빌드한다 — 버전이 `agent_cli.__version__` 에서
      # 나오므로 기본 브랜치로 찍으면 옛 태그에 최신 버전이 붙는다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build==1.3.0

      - name: Build wheel + sdist
        run: python -m build

      # 태그와 패키지 버전이 어긋나면 **올리기 전에** 멈춘다. 버전 bump 를
      # 빠뜨린 채 태그를 미는 사고가 이 저장소에 있었고, 그때 잘못된 버전이
      # 붙은 자산이 나가면 되돌리기가 훨씬 비싸다.
      - name: Tag must match the package version
        run: |
          tag="${{ steps.t.outputs.tag }}"
          ver="$(python -c 'import agent_cli; print(agent_cli.__version__)')"
          echo "tag=$tag  __version__=$ver"
          test "$tag" = "v$ver"
          ls -1 dist/
          test -f "dist/agent_cli-$ver-py3-none-any.whl"
          test -f "dist/agent_cli-$ver.tar.gz"

      # ``--clobber``: 재실행이 같은 자산을 덮어쓰고 실패하지 않는다.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.t.outputs.tag }}" dist/* --clobber
