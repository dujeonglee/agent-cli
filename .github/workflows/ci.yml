name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # ``[web]`` brings in fastapi / uvicorn / sse-starlette which
        # the web-surface tests (test_web_server, test_web_renderer,
        # test_dispatch_agent_or_skill) import at module level. Without
        # them pytest fails collection — the web extra ships in this
        # repo so CI must validate it.
        run: pip install -e ".[dev,web]"

      - name: Run unit tests
        run: pytest tests/ -m "not ollama_integration" -v

  min-deps:
    # 의존성 하한 조합 (v10.124.1) — pyproject 의 하한은 "쓰는 API 가 들어온 버전" 이다.
    # 직접 의존성은 전부 하한으로(lowest-direct), 전이 의존성은 최신으로 깔고, 하한이 스스로
    # 못 막는 전이 패키지만 제약 파일로 묶는다. 파이썬은 requires-python 의 최저(3.10) 하나.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install uv
        # 로컬에서 이 조합을 확인한 판과 같게 고정 — 해석기 동작이 바뀌면 조합이 바뀐다.
        run: pip install uv==0.10.4

      - name: Install lowest direct dependencies
        run: >-
          uv pip install --system --resolution lowest-direct
          -c .github/constraints-min-deps.txt -e ".[dev,web]"

      - name: Show resolved versions
        run: uv pip list --system

      - name: Run unit tests
        run: pytest tests/ -m "not ollama_integration" -v

  browser:
    # 실브라우저(playwright) 테스트 — 별도 잡. 기본 유닛 스위트는
    # tests/browser 를 수집조차 안 하므로(collect_ignore), 여기서만
    # AGENT_CLI_BROWSER_TESTS=1 로 옵트인해 chromium 을 띄운다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,web]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests
        env:
          AGENT_CLI_BROWSER_TESTS: "1"
        run: pytest tests/browser/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pin to match the dev/local version — ruff's default ruleset expands
        # between releases, so an unpinned `pip install ruff` fails CI on new
        # rules that pass locally. Bump this deliberately alongside a lint sweep.
        run: pip install ruff==0.16.0

      - name: Run ruff check
        run: ruff check agent_cli/ tests/

      - name: Run ruff format check
        run: ruff format --check agent_cli/ tests/
