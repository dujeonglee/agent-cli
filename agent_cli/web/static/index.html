<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-cli</title>
  <link rel="stylesheet" href="static/style.css">
  <!-- Set theme before first paint to avoid a flash: saved choice, else the
       system preference (dark is the design default). -->
  <script>
    (function () {
      var THEMES = ["amber", "slate", "midnight", "terminal", "light"];
      try {
        var t = localStorage.getItem("agentcli_theme");
        if (THEMES.indexOf(t) === -1) {
          // no saved choice → light if the system asks for it, else amber
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "amber";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "amber");
      }
    })();
  </script>
</head>
<body>
  <header>
    <span id="info">connecting…</span>
    <span id="token-usage" title="token usage"></span>
    <span id="theme-wrap">
      <button id="theme-btn" type="button" title="테마 선택" aria-haspopup="true" aria-expanded="false">🎨</button>
      <div id="theme-menu" role="menu" hidden></div>
    </span>
    <button id="inspector-btn" type="button" title="Prompt Inspector">⚡</button>
    <button id="teammate-btn" type="button" title="Teammates — 상주 에이전트 대화 창">🤝<span id="tm-badge" hidden></span></button>
    <button id="auto-review-btn" type="button" title="Auto-review: review each completion with a reviewer agent until it accepts" aria-pressed="false">🔍 Review: off</button>
    <button id="export-btn" type="button" title="Export conversation">📤</button>
    <button id="files-btn" type="button" title="Workspace files — download / upload">📁</button>
    <span id="viewers" title="connected viewers"></span>
    <button id="rename-btn" type="button" title="닉네임 변경" hidden>✎</button>
    <span id="conn-status" title="connection status">●</span>
  </header>
  <!-- First-connect nickname bar (pre-filled with the assigned fun default) -->
  <div id="name-bar" hidden>
    <span class="nb-label">닉네임</span>
    <input id="nb-input" type="text" maxlength="24" autocomplete="off"
           placeholder="이름 입력">
    <button id="nb-set" type="button">설정</button>
    <button id="nb-skip" type="button" title="기본값 유지">✕</button>
  </div>
  <main id="messages"></main>

  <!-- Export selection action bar (shown only in export mode) -->
  <div id="export-bar" hidden>
    <label class="exp-all"><input type="checkbox" id="export-all"> All</label>
    <span id="export-count">0 selected</span>
    <span class="exp-actions">
      <button id="export-html" type="button" title="Download as HTML">⬇ HTML</button>
      <button id="export-jira-btn" type="button" title="Post as Jira comment">Jira…</button>
      <button id="export-cancel" type="button" title="Cancel">✕</button>
    </span>
    <span id="export-jira-form" hidden>
      <select id="export-jira-target" title="Jira instance"></select>
      <input id="export-jira-url" type="url" autocomplete="off" placeholder="https://your-jira" title="Jira base URL">
      <span id="export-jira-http-warn" class="exp-warn" hidden>⚠ http 는 자격증명이 평문으로 전송됩니다. 신뢰된 네트워크에서만 사용하세요.</span>
      <select id="export-jira-deployment" title="Jira type">
        <option value="cloud">Cloud</option>
        <option value="server">Server/DC</option>
      </select>
      <input id="export-jira-user" type="text" autocomplete="off" placeholder="email">
      <input id="export-jira-secret" type="password" autocomplete="off" placeholder="API token">
      <input id="export-jira-issue" type="text" placeholder="ISSUE-123" autocomplete="off">
      <button id="export-jira-send" type="button">Send</button>
      <span class="exp-hint" title="Credentials are stored only in this browser (localStorage) and sent over your LAN connection to post as you.">🔒 your account · saved in this browser</span>
    </span>
    <span id="export-msg" class="exp-msg"></span>
  </div>

  <!-- Workspace files drawer (📁) — download (select + zip) + upload (drop) -->
  <div id="download-backdrop" hidden></div>
  <aside id="download-drawer" aria-hidden="true">
    <div class="dl-head">
      <div class="dl-title">📁 Workspace files</div>
      <button id="dl-close" type="button" title="Close">✕</button>
    </div>
    <div id="dl-tree" class="dl-tree"></div>
    <div class="dl-foot">
      <span id="dl-count">0 selected</span>
      <button id="dl-delete" type="button" title="Delete selected (permanent)">🗑 Delete</button>
      <button id="dl-download" type="button" title="Download selected as zip">⬇ Download zip</button>
    </div>
    <div id="ul-drop" class="ul-drop">
      <span id="ul-target" class="ul-target">⬆ 업로드 대상: <b>(루트)</b></span>
      <span class="ul-hint">파일/폴더를 여기로 드래그하거나
        <button id="ul-pick" type="button">파일</button>
        <button id="ul-pick-dir" type="button">폴더</button>
        — 트리에서 폴더를 클릭해 대상 변경</span>
      <input type="file" id="ul-input" multiple hidden>
      <input type="file" id="ul-dir-input" webkitdirectory hidden>
    </div>
    <div id="dl-msg" class="dl-msg"></div>
  </aside>

  <!-- Teammate 대화 창 (🤝) — 상주 에이전트 roster + 대화 + 인간 개입 -->
  <div id="tm-backdrop" hidden></div>
  <aside id="tm-drawer" aria-hidden="true">
    <div class="tm-head">
      <div class="tm-title">🤝 Teammates</div>
      <button id="tm-close" type="button" title="Close">✕</button>
    </div>
    <div id="tm-roster" title="살아있는 teammate — 클릭해 대화 보기"></div>
    <div id="tm-conv"></div>
    <div id="tm-inputrow">
      <textarea id="tm-input" rows="2" placeholder="teammate 를 선택하고 메시지…"
                spellcheck="false" disabled></textarea>
      <button id="tm-send" type="button" disabled>Send</button>
    </div>
  </aside>

  <!-- Prompt Inspector drawer -->
  <div id="inspector-backdrop" hidden></div>
  <aside id="inspector" aria-hidden="true">
    <div class="insp-head">
      <div class="insp-title">⚡ Prompt Inspector</div>
      <div id="insp-meta" class="insp-meta"></div>
      <button id="insp-close" type="button" title="Close">✕</button>
    </div>
    <div id="insp-scopes" class="insp-scopes" title="System prompt scope — main loop or a delegate sub-agent"></div>
    <div id="insp-budget" class="insp-budget" title="per-section token share"></div>
    <details id="insp-dir" class="insp-dir">
      <summary>📝 Directives <span id="insp-dir-path" class="insp-dir-path"></span></summary>
      <textarea id="insp-dir-text" class="insp-dir-text" spellcheck="false"
        placeholder="이 프로젝트의 DIRECTIVE.md — 비어 있으면 새로 만들어집니다. 저장 시 다음 LLM 호출부터 적용(KV 캐시 리셋)."></textarea>
      <div class="insp-dir-foot">
        <span id="insp-dir-status" class="insp-dir-status"></span>
        <!-- Three symmetric axis rows: 성격 / 업무 / 지침. Each = label + dropdown
             (내 프리셋) + action(📋 템플릿 / 📥 학습) + 💾 프리셋 저장 + 🗑 삭제.
             No LLM generation (📋 inserts a static skeleton to fill by hand). -->
        <div class="insp-dir-axis" data-axis="persona">
          <span class="insp-dir-axlabel">성격</span>
          <select id="insp-dir-persona" class="insp-dir-sel" title="성격 프리셋 (말투/캐릭터). 선택 시 반영."></select>
          <button id="insp-dir-persona-tmpl" type="button"
            title="성격 템플릿(빈 골격)을 편집창에 삽입 — 손으로 채웁니다">📋</button>
          <button id="insp-dir-persona-save" type="button"
            title="현재 성격을 프리셋으로 저장 (홈, 모든 방 공유)">💾</button>
          <button id="insp-dir-persona-del" type="button" title="선택한 성격 프리셋 삭제">🗑</button>
        </div>
        <div class="insp-dir-axis" data-axis="task">
          <span class="insp-dir-axlabel">업무</span>
          <select id="insp-dir-task" class="insp-dir-sel" title="업무 프리셋 (역할/작업). 선택 시 반영."></select>
          <button id="insp-dir-task-tmpl" type="button"
            title="업무 템플릿(빈 골격)을 편집창에 삽입 — 손으로 채웁니다">📋</button>
          <button id="insp-dir-task-save" type="button"
            title="현재 업무를 프리셋으로 저장 (홈, 모든 방 공유)">💾</button>
          <button id="insp-dir-task-del" type="button" title="선택한 업무 프리셋 삭제">🗑</button>
        </div>
        <div class="insp-dir-axis" data-axis="learned">
          <span class="insp-dir-axlabel">지침</span>
          <select id="insp-dir-learned" class="insp-dir-sel"
            title="학습된 지침 프리셋 (홈, 모든 방 공유). 선택 시 학습 섹션에 반영."></select>
          <button id="insp-dir-learn" type="button" class="insp-dir-gen-btn"
            title="현재 세션 대화에서 재사용 가능한 지침을 학습해 반영 (미저장)">📥</button>
          <button id="insp-dir-learned-save" type="button"
            title="현재 학습된 지침을 프리셋으로 저장 (홈, 모든 방 공유)">💾</button>
          <button id="insp-dir-learned-del" type="button" title="선택한 지침 프리셋 삭제">🗑</button>
        </div>
        <button id="insp-dir-cancel" type="button" title="편집 취소 — 파일 원본으로 되돌림">취소</button>
        <button id="insp-dir-save" type="button">저장</button>
      </div>
    </details>
    <!-- 💾 preset save modal — fixed location (read-only) + name + existing list. -->
    <div id="dir-preset-modal" class="dir-modal" hidden>
      <div class="dir-modal-box">
        <div class="dir-modal-title" id="dir-preset-modal-title">프리셋 저장</div>
        <label class="dir-modal-loc">저장 위치 (고정)
          <input id="dir-preset-modal-loc" type="text" readonly tabindex="-1" />
        </label>
        <label class="dir-modal-name">이름
          <input id="dir-preset-modal-name" type="text" placeholder="프리셋 이름…" />
        </label>
        <div class="dir-modal-existing" id="dir-preset-modal-existing"></div>
        <div class="dir-modal-foot">
          <button id="dir-preset-modal-cancel" type="button">취소</button>
          <button id="dir-preset-modal-save" type="button">저장</button>
        </div>
      </div>
    </div>
    <input id="insp-search" type="search" placeholder="Filter sections…" autocomplete="off">
    <div id="insp-sections" class="insp-sections"></div>
  </aside>
  <footer>
    <div id="input-mode-badge"></div>
    <div id="queue-list" hidden></div>
    <div id="input-area">
      <textarea id="input"
                placeholder="Type a message — Enter to send, Shift+Enter for newline"
                rows="3"></textarea>
      <button id="send" type="button">Send</button>
      <button id="chat-stop" type="button" hidden title="Stop the current run">Stop</button>
      <button id="abort" type="button" hidden>Stop</button>
    </div>
  </footer>
  <script src="static/app.js"></script>
</body>
</html>
